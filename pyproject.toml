[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-gain"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "earthengine-api",
    "ee",
    "geoai-py",
    "geotessera",
    "numpy",
    "pyproj",
    "python-dotenv",
    "rasterio",
    "streamlit",
    "folium",
    "streamlit-folium",
    "tqdm",
    "torch",
    "pytorch-lightning",
    "peft",
    "terratorch",
    "scikit-image",
    "scipy",
]

[project.scripts]
forest-gain = "forest_gain_tiling.main:main"

[tool.setuptools.packages.find]
where = ["DataCollection/forest_gain_tiling", "ModelDev"]
include = [
    "embeddings*",
    "export*",
    "filtering*",
    "gee*",
    "gee_datasets*",
    "labels*",
    "registry*",
    "stack*",
    "inspector*",
    "tiling*",
    "prithvi_gain*",
